# Bitwarden Lite - Docker Compose Configuration
# ============================================
# Self-hosted Bitwarden password manager for personal use
# Optimized for Debian 12 with nginx reverse proxy
# See README.md for installation instructions

# Project name derived from INSTANCE_NAME to prevent container collisions
name: ${INSTANCE_NAME}-prod

services:
  # ============================================
  # BITWARDEN SERVICE
  # ============================================
  bitwarden:
    image: ghcr.io/bitwarden/lite:${BW_VERSION:-latest}
    container_name: ${INSTANCE_NAME}-bitwarden-prod
    restart: unless-stopped
    
    # Environment variables from .env file
    env_file:
      - .env
    
    # Port mapping for nginx reverse proxy
    # Only expose HTTP port to localhost (127.0.0.1)
    ports:
      - "${BW_PORT_HTTP:-8491}:${BW_PORT_HTTP:-80}"
    
    # Persistent data volume
    volumes:
      - bitwarden-data:/etc/bitwarden
    
    # Resource limits (minimum 200MB required)
    mem_limit: ${BW_MEMORY_LIMIT:-512m}
    memswap_limit: ${BW_MEMORY_LIMIT:-512m}
    
    # Health check
    healthcheck:
     test: ["CMD", "curl", "-f", "http://localhost:${BW_PORT_HTTP:-8080}/alive"]
     interval: 30s
     timeout: 10s
     retries: 3
     start_period: 60s
    
    # Network configuration
    networks:
      - bitwarden-network
    
    # Service dependencies
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================
  # POSTGRESQL SERVICE
  # ============================================
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: ${INSTANCE_NAME}-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: ${BW_DB_DATABASE:-bitwarden_vault}
      POSTGRES_USER: ${BW_DB_USERNAME:-bitwarden}
      POSTGRES_PASSWORD: ${BW_DB_PASSWORD}
      POSTGRES_ROOT_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    mem_limit: ${DB_MEMORY_LIMIT:-256m}
    memswap_limit: ${DB_MEMORY_LIMIT:-256m}
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BW_DB_USERNAME:-bitwarden}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    networks:
      - bitwarden-network

  # ============================================
  # MYSQL/MARIADB SERVICE (Optional)
  # ============================================
  # Uncomment this service if using MySQL/MariaDB
  # Remember to set BW_DB_PROVIDER=mysql in .env
  
  # mysql:
  #   image: mysql:${MYSQL_VERSION:-8.0}
  #   container_name: ${INSTANCE_NAME}-mysql
  #   restart: unless-stopped
  #   
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  #     MYSQL_DATABASE: ${BW_DB_DATABASE:-bitwarden_vault}
  #     MYSQL_USER: ${BW_DB_USERNAME:-bitwarden}
  #     MYSQL_PASSWORD: ${BW_DB_PASSWORD}
  #   
  #   command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  #   
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   
  #   mem_limit: ${DB_MEMORY_LIMIT:-256m}
  #   memswap_limit: ${DB_MEMORY_LIMIT:-256m}
  #   
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${BW_DB_USERNAME:-bitwarden}", "-p${BW_DB_PASSWORD}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 30s
  #   
  #   networks:
  #     - bitwarden-network

# ============================================
# NETWORKS
# ============================================
networks:
  bitwarden-network:
    name: ${INSTANCE_NAME}-bitwarden-network
    driver: bridge
#    ipam:
#      config:
#        - subnet: 172.20.0.0/24

# ============================================
# VOLUMES
# ============================================
volumes:
  # Bitwarden data volume (configuration and SQLite database if used)
  bitwarden-data:
    name: ${INSTANCE_NAME}-bitwarden-data
    driver: local
  
  # PostgreSQL data volume
  postgres-data:
    name: ${INSTANCE_NAME}-bitwarden-postgres-data
    driver: local
  
  # MySQL data volume (uncomment if using MySQL)
  # mysql-data:
  #   name: ${INSTANCE_NAME}-mysql-data
  #   driver: local